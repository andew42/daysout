name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (linux/amd64 and linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o daysout-amd64 .
          GOOS=linux GOARCH=arm64 go build -o daysout-arm64 .

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: daysout-binaries
          path: |
            backend/daysout-amd64
            backend/daysout-arm64
          retention-days: 30

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 30

  scraper:
    name: Scraper (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover tests

      - name: Coordinate conversion self-test
        run: python ../setup/import_postcodes.py --self-test

  package:
    name: Package (install bundle)
    runs-on: ubuntu-latest
    needs: [backend, frontend, scraper]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download backend executables
        uses: actions/download-artifact@v8
        with:
          name: daysout-binaries
          path: staging/binaries

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: staging/frontend-build

      # Bundle layout matches the DAYSOUT=/opt/daysout runtime paths:
      # binaries at the root, frontend/build/, scraper/ and setup/ beside
      # them, systemd units at the root for install.sh to copy.
      - name: Assemble bundle
        run: |
          mkdir -p bundle/frontend
          cp staging/binaries/daysout-amd64 staging/binaries/daysout-arm64 bundle/
          cp -r staging/frontend-build bundle/frontend/build
          cp -r scraper setup bundle/
          rm -rf bundle/scraper/tests bundle/scraper/daysout_scraper/__pycache__
          cp packaging/daysout.service packaging/daysout-scrape.service \
             packaging/daysout-scrape.timer packaging/install.sh bundle/
          tar -czf daysout.tar.gz -C bundle .

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: daysout-bundle
          path: daysout.tar.gz
          retention-days: 30

      # Rolling 'latest' release so the container can fetch a stable URL:
      #   https://github.com/<repo>/releases/latest/download/daysout.tar.gz
      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Rolling release updated by CI on every push to master.

          Install or upgrade with:

              curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash
          EOF
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes-file release-notes.md \
            daysout.tar.gz packaging/install.sh
