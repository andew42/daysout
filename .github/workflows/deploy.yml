name: Deploy to house server

# Runs on the self-hosted runner inside the daysout LXD container (see
# docs/self-hosted-runner.md). Fires automatically whenever the Build
# workflow goes green on master — so every good push lands on the house
# server — and can also be run manually from the Actions tab. Installs the
# latest rolling release exactly as a user would, smoke-tests the live
# site, and runs a bounded verification scrape from the home network.
# The one-off downloads (postcodes ~25 MB, GB map tiles ~2-3 GB) happen
# on the first deploy and are skipped once the files exist.
#
# Never triggered by pull requests or forks: workflow_run only fires for
# the Build workflow on this repo's master branch.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      scrape_max_pages:
        description: "Scrape scope: 'full', 'skip', or a page limit per source"
        default: "full"

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Install latest release
        run: |
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash

      - name: Smoke test
        run: |
          sleep 3
          sudo systemctl --no-pager status daysout | head -8
          curl -sf http://localhost:8080/api/status | tee /tmp/status.json
          echo
          curl -sf -o /dev/null -w "frontend: %{http_code}\n" http://localhost:8080/
          curl -sf -o /dev/null -w "spa route: %{http_code}\n" http://localhost:8080/events
          curl -sf -o /dev/null -w "sources tab: %{http_code}\n" http://localhost:8080/sources
          curl -sf http://localhost:8080/api/sources \
            | python3 -c "
          import json, sys
          body = json.load(sys.stdin)
          print('sources listed:', len(body['sources']), '| kinds:', ','.join(body['kinds']))"
          # The Update button runs the scraper for one source. Check the
          # route answers and refuses an unknown name; updating a real
          # source here would just duplicate the scrape step below.
          #
          # Assert the refusal, not just "it responded": an unknown API
          # path falls through to the SPA handler and comes back as 200
          # HTML, so this check went on passing for a deploy after the
          # route was renamed from /test to /update while hitting nothing.
          CODE=$(curl -s -o /tmp/update-source.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"name":"definitely-not-a-source"}' \
            http://localhost:8080/api/sources/update)
          echo "update endpoint: $CODE"
          cat /tmp/update-source.json; echo
          python3 -c "
          import json, sys
          code = '$CODE'
          assert code == '400', f'expected 400 for an unknown source, got {code}'
          body = json.load(open('/tmp/update-source.json'))
          assert 'no source named' in body.get('error', ''), body
          print('OK: /api/sources/update refuses an unknown source')" 
          python3 -c "
          import json
          s = json.load(open('/tmp/status.json'))
          assert s['destinations'] > 0, 'no destinations in database'
          print('OK:', s['destinations'], 'destinations,', s['events'], 'events,',
                s['postcodes'], 'postcodes, tiles:', s['tilesAvailable'])"

      - name: Import postcodes (first deploy only)
        run: |
          COUNT=$(python3 -c "
          import json; print(json.load(open('/tmp/status.json'))['postcodes'])")
          if [ "$COUNT" -gt 0 ]; then
            echo "postcode table already has $COUNT rows — skipping"
          else
            sudo python3 /opt/daysout/setup/import_postcodes.py --db /var/lib/daysout/daysout.db
          fi

      - name: Download map tiles (first deploy only)
        # The script itself skips when a valid archive exists and re-fetches
        # a partial one, so it's safe to run every deploy.
        run: sudo /opt/daysout/setup/get-tiles.sh --data-dir /var/lib/daysout

      - name: Ensure browser automation is available
        # The container was built with apt packages only, so pip may not be
        # there at all — the first attempt at this step exited instantly
        # because `pip3` did not exist, and continue-on-error hid it. Print
        # what happens at each stage so a failure says why.
        continue-on-error: true
        run: |
          set -x
          if ! python3 -c "import playwright" 2>/dev/null; then
            command -v pip3 >/dev/null || sudo apt-get install -y -qq python3-pip
            sudo pip3 install --break-system-packages playwright \
              || sudo pip3 install playwright
          fi
          python3 -c "import playwright; print('playwright import OK')"

          # Reuse a Chromium already on the machine if there is one; only
          # download Playwright's (~150 MB) when there isn't.
          if sudo python3 -c "
          import sys; sys.path.insert(0, '/opt/daysout/scraper')
          from daysout_scraper import browser
          found = browser.find_chromium()
          print('existing Chromium:', found or '(none)')
          sys.exit(0 if found else 1)"; then
            echo "no browser download needed"
          else
            sudo python3 -m playwright install --with-deps chromium
          fi

          # State the outcome plainly: browser sources are skipped without it.
          sudo python3 -c "
          import sys; sys.path.insert(0, '/opt/daysout/scraper')
          from daysout_scraper import browser
          print('browser scanning available:', browser.available(),
                '| chromium:', browser.find_chromium() or '(playwright default)')"

      - name: Scrape
        # A full crawl by default: only a complete run gathers every
        # property and every current event, and only it may purge rows that
        # have gone. It costs ~500 polite requests the first time each day;
        # the fetcher's cache makes later deploys cheap.
        # inputs is empty on workflow_run triggers, so gate in shell.
        continue-on-error: true
        env:
          MAX_PAGES: ${{ inputs.scrape_max_pages || 'full' }}
        run: |
          cd /opt/daysout/scraper
          case "$MAX_PAGES" in
            skip) echo "scrape skipped"; exit 0 ;;
            full|"") LIMIT="" ;;
            *) LIMIT="--max-pages $MAX_PAGES" ;;
          esac
          # Keep the log: the next step reads it for events the pipeline
          # could not attach to a venue, which is invisible in the counts.
          sudo env DAYSOUT_DATA=/var/lib/daysout \
            python3 -m daysout_scraper $LIMIT --keep-seed 2>&1 \
            | sudo tee /tmp/scrape.log
          exit "${PIPESTATUS[0]}"

      - name: Events that found no venue
        # An event whose venue matches no destination is dropped, so a
        # source can read events all day and contribute nothing. These
        # lines name the venues that failed to match.
        continue-on-error: true
        run: |
          if [ -f /tmp/scrape.log ]; then
            grep -c "could not place" /tmp/scrape.log \
              | xargs -I{} echo "{} event(s) had no matching destination"
            grep "could not place" /tmp/scrape.log | head -20 || true
          else
            echo "no scrape log (scrape was skipped)"
          fi

      - name: Diagnose map tiles
        # The style's 71 layers reference source-layers earth/landcover/
        # landuse/roads/water/buildings/boundaries/pois/places and need
        # "Noto Sans Regular|Medium|Italic" glyphs plus a sprite. Check the
        # archive really contains those layers and that the browser can
        # actually fetch tiles, glyphs and sprite through the server.
        continue-on-error: true
        run: |
          cd /var/lib/daysout
          echo "=== pmtiles archive metadata"
          ./pmtiles show uk.pmtiles 2>&1 | head -40 || pmtiles show uk.pmtiles 2>&1 | head -40
          echo
          echo "=== basemap asset layout"
          ls basemap | head
          echo "--- fonts:"; ls basemap/fonts 2>&1 | head -5
          echo "--- sprites:"; find basemap/sprites -maxdepth 2 2>&1 | head -12
          echo
          echo "=== what the browser actually gets"
          curl -s -o /dev/null -w "  tile archive (range):   %{http_code} (%{size_download} bytes)\n" \
            -H 'Range: bytes=0-16383' http://localhost:8080/tiles/uk.pmtiles
          curl -s -o /dev/null -w "  glyphs Noto Sans Regular: %{http_code}\n" \
            "http://localhost:8080/basemap/fonts/Noto%20Sans%20Regular/0-255.pbf"
          curl -s -o /dev/null -w "  sprite v4/light.json:     %{http_code}\n" \
            http://localhost:8080/basemap/sprites/v4/light.json
          curl -s -o /dev/null -w "  sprite light.json:        %{http_code}\n" \
            http://localhost:8080/basemap/sprites/light.json

      - name: Discover what candidate sources publish
        # The development sandbox cannot reach these sites, so the probe
        # runs here and its findings decide which extractor each source
        # gets. Results are recorded in sources.last_status.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -m daysout_scraper.discover || true

      - name: Diagnose National Trust
        # Two separate questions, and only the box can answer them.
        # 1. Does robots.txt allow a property's events page? (It is the
        #    fetcher that decides, so ask the fetcher, not a human reading
        #    the file.)
        # 2. Does the site serve that page, or a bot-protection challenge?
        #    A challenge is a refusal and the source stops on it; this
        #    prints which of the two we are actually getting.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -c "
          import sys
          sys.path.insert(0, '/opt/daysout/scraper')
          from daysout_scraper.fetch import Fetcher, USER_AGENT
          from daysout_scraper import jsonld
          from daysout_scraper.sources.national_trust import looks_like_a_challenge

          URL = ('https://www.nationaltrust.org.uk/visit/'
                 'oxfordshire-buckinghamshire-berkshire/stowe-gardens/events')
          fetcher = Fetcher('/var/lib/daysout/scrape-cache')
          print('robots.txt allows it:', fetcher._allowed(URL))
          try:
              body = fetcher.get(URL)
          except Exception as e:
              print('fetch failed:', e)
              raise SystemExit(0)
          print('bytes:', len(body))
          print('bot-protection challenge:', looks_like_a_challenge(body))
          objects = jsonld.extract_objects(body)
          print('JSON-LD objects:', len(objects),
                sorted({str(o.get('@type')) for o in objects}))
          events = [jsonld.parse_event(o, URL) for o in objects]
          events = [e for e in events if e]
          print('Events found:', len(events))
          for event in events[:5]:
              print('   ', event['start_date'], event['title'],
                    '@', event['location_name'] or '(unnamed)',
                    event['location_postcode'])
          print()
          print('--- robots.txt lines mentioning /visit or Disallow:')
          robots = fetcher.session.get('https://www.nationaltrust.org.uk/robots.txt',
                                       timeout=30).text
          for line in robots.splitlines():
              if 'visit' in line.lower() or line.lower().startswith(('user-agent', 'disallow')):
                  print('   ', line.strip())" || true

      - name: Hunt for event APIs on the candidate sites
        # A documented WordPress events API is the best outcome available:
        # dated, located JSON, no rendering and no guessing at markup. A
        # large share of UK venue sites run that plugin, so ask each of
        # the sites that currently yield nothing.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          for URL in https://ngs.org.uk/ https://www.historichouses.org/ \
                     https://www.invitationtoview.co.uk/ https://aoh.org.uk/ \
                     https://www.thefestivalcalendar.co.uk/ ; do
            echo "########## $URL"
            sudo env DAYSOUT_DATA=/var/lib/daysout \
              python3 -m daysout_scraper.feedhunt --url "$URL" --skip-sitemap || true
          done

      - name: What is actually on a listing page that carries no dates
        # Rendering an NGS page added 130 KB and still produced no dates,
        # which explains nothing on its own. Three things would: the
        # listing is in an iframe, it is behind a search form, or it never
        # arrives. The renderer now scrolls, which may itself fix it.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          # --fresh matters: the last run read a cached render, so the
          # scrolling change was never exercised and the byte counts came
          # back identical, which looked like evidence and was not.
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -m daysout_scraper.discover \
            --url https://ngs.org.uk/gardens-open-this-week-midlands/ \
            --browser --deep --fresh || true

      - name: What Shuttleworth's event pages actually carry
        # The first attempt at this assumed the dates were in the URLs and
        # was simply wrong: 374 URLs, none of them dated. So ask the site
        # what its event pages hold instead of guessing again — the URL
        # shapes, and then inside the newest event-shaped page.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -m daysout_scraper.feedhunt \
            --url https://www.shuttleworth.org/ --scan-newest --skip-probes || true

      - name: Hunt for a sanctioned route into National Trust events
        # The pages are closed to us and we do not work around that, so
        # look for a route the site offers instead: a calendar feed, an
        # RSS file, or a sitemap detailed enough to be useful on its own.
        # A sitemap is published precisely so automated clients can
        # discover what a site holds, so reading one circumvents nothing —
        # the question is whether the URLs carry event dates.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -m daysout_scraper.feedhunt \
            --url https://www.nationaltrust.org.uk/ || true

      - name: Diagnose a rendered listing page
        # What does a client-side listing actually contain once rendered?
        # Prints the un-rendered and rendered DOM side by side — dates,
        # date-carrying elements, event links — so "a DOM parser would
        # work here" is a conclusion from evidence rather than a guess,
        # and "rendering changed nothing" is visible as a byte count.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          # The "this coming week" page turned out to be a hub: rendering
          # doubles it (110k -> 240k bytes) but it carries no dates, only
          # "Click here" links to a page per region. So probe a region page
          # — that is where a listing, if there is one, has to be.
          for URL in https://ngs.org.uk/garden-open-this-week-east-of-england/ \
                     https://ngs.org.uk/gardens-open-this-week-midlands/ ; do
            sudo env DAYSOUT_DATA=/var/lib/daysout \
              python3 -m daysout_scraper.discover --url "$URL" --browser || true
            echo
          done

      - name: Diagnose sources that found nothing
        # Prints what the pages of each source actually contain, so parser
        # or URL-pattern problems can be fixed against real markup. Cheap:
        # the pages come from the scrape cache.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          echo "########## english_heritage newest what's-on pages (do current ones carry dates?)"
          sudo env DAYSOUT_DATA=/var/lib/daysout \
            python3 -m daysout_scraper.inspect --source english_heritage \
              --kind event --newest --count 3 || true

      - name: What a Historic Houses page carries
        # The parser was written from the sitemap's shape and the site's
        # own description of a house page, because nothing in the sandbox
        # can reach the site. This says which of its three ways of finding
        # a postcode actually fires, so the guesswork can be removed.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          sudo env DAYSOUT_DATA=/var/lib/daysout python3 -c "
          import logging, sys
          logging.basicConfig(level=logging.INFO)
          sys.path.insert(0, '.')
          from daysout_scraper.fetch import Fetcher
          from daysout_scraper.sitemap_source import sitemap_urls
          from daysout_scraper.sources import historic_houses as hh

          fetcher = Fetcher('/var/lib/daysout/scrape-cache')
          urls = [u for u in sitemap_urls(fetcher, hh.HistoricHouses.sitemaps[0])
                  if hh.HOUSE_RE.match(u)]
          print(len(urls), 'house pages in the sitemap')
          for url in urls[:5]:
              body = fetcher.get(url)
              from bs4 import BeautifulSoup
              soup = BeautifulSoup(body, 'html.parser')
              from daysout_scraper import jsonld
              types = sorted({t for o in jsonld.extract_objects(body)
                                for t in (o.get('@type') if isinstance(o.get('@type'), list)
                                          else [o.get('@type')]) if t})
              found, how = hh._postcode_from_markup(soup)
              place = hh.parse_house(body, url)
              print(f'=== {url}')
              print(f'    {len(body)} bytes | JSON-LD types: {types or \"(none)\"}')
              print(f'    markup postcode: {found or \"(none)\"} via {how or \"(nothing)\"}')
              if place:
                  print(f'    PARSED {place[\"name\"]} | {place[\"postcode\"]}'
                        f' | {place[\"category\"]}')
              else:
                  print('    NOT PARSED — no postcode found on this page')" || true

      - name: What the Events tab actually receives
        # "No change" after a deploy has two very different causes: the
        # server is not sending the new data, or the browser is showing an
        # old bundle. Only the first is visible from here, so print it —
        # the exact JSON the Events tab renders from, for the home
        # postcode, plus the venue rows behind the map pins.
        continue-on-error: true
        run: |
          HOME_POSTCODE="SN13 8AA"
          echo "########## /api/events for $HOME_POSTCODE (60 min, 7 days)"
          curl -sf --get http://localhost:8080/api/events \
            --data-urlencode "postcode=$HOME_POSTCODE" \
            --data-urlencode "minutes=60" --data-urlencode "days=7" \
            -o /tmp/events.json
          python3 -c "
          import json
          body = json.load(open('/tmp/events.json'))
          print('shown:', len(body['events']), '| minutes:', body['minutes'],
                '| days:', body['days'])
          for e in body['events'][:8]:
              d = e['destination']
              print(f\"  {e['startDate']}..{e['endDate']}  {e['title']}\"
                    f\"  @ {d['name']} ~{round(d['driveMinutes'])} min\")
          x = body.get('excluded')
          if x is None:
              print('NO excluded key — the server is running an old build')
          else:
              print('excluded:', json.dumps(x))
              if not any(x.get(k) for k in ('tooFar', 'later', 'wrongCategory')):
                  print('  (all zero — the Events tab shows no note, correctly)')"

          echo "########## venues behind the map pins (do they carry a link?)"
          sudo python3 -c "
          import sqlite3
          db = sqlite3.connect('/var/lib/daysout/daysout.db')
          rows = db.execute(
              \"SELECT source, name, postcode, url, lat, lon FROM destinations\"
              \" WHERE source NOT IN ('seed', 'wikidata', 'english_heritage')\"
              ' ORDER BY source, name').fetchall()
          print(len(rows), 'venue(s) created from events:')
          for source, name, postcode, url, lat, lon in rows:
              print(f'  [{source}] {name} | {postcode or \"no postcode\"} |'
                    f' {url or \"NO LINK\"} | {lat},{lon}')
          missing = [r for r in rows if not r[3]]
          if missing:
              print('WARNING:', len(missing), 'venue(s) still have no url')"

      - name: Result summary
        run: |
          echo "=== scrape runs ==="
          sudo python3 -c "
          import sqlite3
          db = sqlite3.connect('/var/lib/daysout/daysout.db')
          for row in db.execute(
              'SELECT source, started_at, ok, message FROM scrape_runs ORDER BY id DESC LIMIT 6'):
              print(row)
          print('--- non-seed destinations by source:')
          for row in db.execute(
              \"SELECT source, COUNT(*) FROM destinations WHERE source != 'seed' GROUP BY source\"):
              print(row)
          print('--- sample:')
          for row in db.execute(
              \"SELECT name, category, postcode, lat, lon FROM destinations WHERE source != 'seed' LIMIT 8\"):
              print(row)"
          echo "=== what a visitor would actually see this week ==="
          sudo python3 -c "
          import sqlite3, datetime
          db = sqlite3.connect('/var/lib/daysout/daysout.db')
          today = datetime.date.today().isoformat()
          horizon = (datetime.date.today() + datetime.timedelta(days=7)).isoformat()
          # Order as the site does — one-off events before standing
          # programmes (backend/store/queries.go, OngoingDays = 14).
          # Sorting by start date alone showed ten year-long programmes and
          # hid the jousts happening that very weekend, which is exactly
          # the failure this check exists to catch.
          rows = db.execute(
              'SELECT e.start_date, e.end_date, e.title, d.name, d.postcode, '
              \"  julianday(e.end_date) - julianday(e.start_date) > 14 AS ongoing \"
              'FROM events e JOIN destinations d ON d.id = e.destination_id '
              'WHERE e.end_date >= ? AND e.start_date <= ? '
              'ORDER BY ongoing, e.start_date LIMIT 10', (today, horizon)).fetchall()
          print(f'{len(rows)} event(s) in the next 7 days (showing up to 10):')
          for start, end, title, place, postcode, ongoing in rows:
              when = start if start == end else f'{start}..{end}'
              print(f'  {\"[ongoing] \" if ongoing else \"\"}{when}  {title}  @ {place} {postcode}')
          if not rows:
              print('  NONE — check whether scraped events are all in the past')"
          echo "=== live status ==="
          curl -sf http://localhost:8080/api/status
