name: Deploy to house server

# Runs on the self-hosted runner inside the daysout LXD container (see
# docs/self-hosted-runner.md). Fires automatically whenever the Build
# workflow goes green on master — so every good push lands on the house
# server — and can also be run manually from the Actions tab. Installs the
# latest rolling release exactly as a user would, smoke-tests the live
# site, and runs a bounded verification scrape from the home network.
# The one-off downloads (postcodes ~25 MB, GB map tiles ~2-3 GB) happen
# on the first deploy and are skipped once the files exist.
#
# Never triggered by pull requests or forks: workflow_run only fires for
# the Build workflow on this repo's master branch.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      scrape_max_pages:
        description: "Scrape scope: 'full', 'skip', or a page limit per source"
        default: "full"

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Install latest release
        run: |
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash

      - name: Smoke test
        run: |
          sleep 3
          sudo systemctl --no-pager status daysout | head -8
          curl -sf http://localhost:8080/api/status | tee /tmp/status.json
          echo
          curl -sf -o /dev/null -w "frontend: %{http_code}\n" http://localhost:8080/
          curl -sf -o /dev/null -w "spa route: %{http_code}\n" http://localhost:8080/events
          python3 -c "
          import json
          s = json.load(open('/tmp/status.json'))
          assert s['destinations'] > 0, 'no destinations in database'
          print('OK:', s['destinations'], 'destinations,', s['events'], 'events,',
                s['postcodes'], 'postcodes, tiles:', s['tilesAvailable'])"

      - name: Import postcodes (first deploy only)
        run: |
          COUNT=$(python3 -c "
          import json; print(json.load(open('/tmp/status.json'))['postcodes'])")
          if [ "$COUNT" -gt 0 ]; then
            echo "postcode table already has $COUNT rows — skipping"
          else
            sudo python3 /opt/daysout/setup/import_postcodes.py --db /var/lib/daysout/daysout.db
          fi

      - name: Download map tiles (first deploy only)
        # The script itself skips when a valid archive exists and re-fetches
        # a partial one, so it's safe to run every deploy.
        run: sudo /opt/daysout/setup/get-tiles.sh --data-dir /var/lib/daysout

      - name: Scrape
        # A full crawl by default: only a complete run gathers every
        # property and every current event, and only it may purge rows that
        # have gone. It costs ~500 polite requests the first time each day;
        # the fetcher's cache makes later deploys cheap.
        # inputs is empty on workflow_run triggers, so gate in shell.
        continue-on-error: true
        env:
          MAX_PAGES: ${{ inputs.scrape_max_pages || 'full' }}
        run: |
          cd /opt/daysout/scraper
          case "$MAX_PAGES" in
            skip) echo "scrape skipped"; exit 0 ;;
            full|"") LIMIT="" ;;
            *) LIMIT="--max-pages $MAX_PAGES" ;;
          esac
          sudo env DAYSOUT_DATA=/var/lib/daysout \
            python3 -m daysout_scraper $LIMIT --keep-seed

      - name: Diagnose map tiles
        # The style's 71 layers reference source-layers earth/landcover/
        # landuse/roads/water/buildings/boundaries/pois/places and need
        # "Noto Sans Regular|Medium|Italic" glyphs plus a sprite. Check the
        # archive really contains those layers and that the browser can
        # actually fetch tiles, glyphs and sprite through the server.
        continue-on-error: true
        run: |
          cd /var/lib/daysout
          echo "=== pmtiles archive metadata"
          ./pmtiles show uk.pmtiles 2>&1 | head -40 || pmtiles show uk.pmtiles 2>&1 | head -40
          echo
          echo "=== basemap asset layout"
          ls basemap | head
          echo "--- fonts:"; ls basemap/fonts 2>&1 | head -5
          echo "--- sprites:"; find basemap/sprites -maxdepth 2 2>&1 | head -12
          echo
          echo "=== what the browser actually gets"
          curl -s -o /dev/null -w "  tile archive (range):   %{http_code} (%{size_download} bytes)\n" \
            -H 'Range: bytes=0-16383' http://localhost:8080/tiles/uk.pmtiles
          curl -s -o /dev/null -w "  glyphs Noto Sans Regular: %{http_code}\n" \
            "http://localhost:8080/basemap/fonts/Noto%20Sans%20Regular/0-255.pbf"
          curl -s -o /dev/null -w "  sprite v4/light.json:     %{http_code}\n" \
            http://localhost:8080/basemap/sprites/v4/light.json
          curl -s -o /dev/null -w "  sprite light.json:        %{http_code}\n" \
            http://localhost:8080/basemap/sprites/light.json

      - name: Diagnose sources that found nothing
        # Prints what the pages of each source actually contain, so parser
        # or URL-pattern problems can be fixed against real markup. Cheap:
        # the pages come from the scrape cache.
        continue-on-error: true
        run: |
          cd /opt/daysout/scraper
          echo "########## english_heritage newest what's-on pages (do current ones carry dates?)"
          sudo env DAYSOUT_DATA=/var/lib/daysout \
            python3 -m daysout_scraper.inspect --source english_heritage \
              --kind event --newest --count 3 || true

      - name: Result summary
        run: |
          echo "=== scrape runs ==="
          sudo python3 -c "
          import sqlite3
          db = sqlite3.connect('/var/lib/daysout/daysout.db')
          for row in db.execute(
              'SELECT source, started_at, ok, message FROM scrape_runs ORDER BY id DESC LIMIT 6'):
              print(row)
          print('--- non-seed destinations by source:')
          for row in db.execute(
              \"SELECT source, COUNT(*) FROM destinations WHERE source != 'seed' GROUP BY source\"):
              print(row)
          print('--- sample:')
          for row in db.execute(
              \"SELECT name, category, postcode, lat, lon FROM destinations WHERE source != 'seed' LIMIT 8\"):
              print(row)"
          echo "=== live status ==="
          curl -sf http://localhost:8080/api/status
